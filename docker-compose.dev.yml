# Development override: builds the image from source.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Or, to stop repeating the -f on every command, put this in your .env:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml
#
# `docker-compose.yml` on its own pulls the published image — that is the path
# for someone who just wants to try it, which is why it is the default.

x-build: &build
  build:
    context: .
    args:
      AWAH_VERSION: dev

services:
  migrate:
    <<: *build
    image: awah-api:dev

  api:
    <<: *build
    image: awah-api:dev

  api2:
    <<: *build
    image: awah-api:dev
