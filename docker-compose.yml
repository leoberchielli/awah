name: awah

# This file runs on its own, with no source code.
#
#   curl -O https://raw.githubusercontent.com/leoberchielli/awah/main/docker-compose.yml
#   docker compose up -d
#
# The image comes ready from the registry. To build from source instead, add
# the development override:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# The defaults are for local development only. In production set everything
# through .env — the keys below are public and live in this repository.

# One place for the image. AWAH_IMAGE points at another registry or another tag
# without editing the three occurrences.
x-image: &image ${AWAH_IMAGE:-ghcr.io/leoberchielli/awah:latest}
x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-development}
  PORT: "2900"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://awah:awah@postgres:5432/awah
  REDIS_URL: redis://redis:6379
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-YXdhaC1kZXYta2V5LW5vdC1mb3ItcHJvZHVjdGlvbiE=}
  COOKIE_SECRET: ${COOKIE_SECRET:-awah-dev-cookie-secret-change-before-production}
  ALLOW_OPEN_REGISTRATION: ${ALLOW_OPEN_REGISTRATION:-true}
  # Empty in development; required once the instance becomes reachable.
  PUBLIC_URL: ${PUBLIC_URL:-}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  ENGINE_LOG_LEVEL: ${ENGINE_LOG_LEVEL:-silent}
  # Off by default, and the API refuses to boot with it on in production:
  # the simulator is not a WhatsApp client.
  SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-false}
  # The dashboard funnel reads the hourly aggregates, so on a fresh instance it
  # shows zeros until the first aggregation runs. Five minutes is right for a
  # real deployment and much too long when you are watching it work.
  AGGREGATOR_INTERVAL_MS: ${AGGREGATOR_INTERVAL_MS:-300000}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: awah
      POSTGRES_PASSWORD: awah
      POSTGRES_DB: awah
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - awah-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awah -d awah"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - awah-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One shot: applies the migrations and exits. The API waits for it to finish.
  migrate:
    image: *image
    command: ["node", "apps/api/dist/migrate.js"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: *image
    environment:
      <<: *api-env
      NODE_ID: awah-1
    ports:
      - "${PORT:-2900}:2900"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2900/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # A second replica. Bring it up with the `cluster` profile:
  #   docker compose --profile cluster up -d
  # It exists so failover and command routing get exercised for real — in
  # production this would be N replicas behind a load balancer, configured
  # exactly like this one.
  api2:
    profiles: ["cluster"]
    image: *image
    environment:
      <<: *api-env
      NODE_ID: awah-2
    ports:
      - "${PORT2:-2901}:2900"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2900/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

# Named volumes rather than folders in the repository: whoever downloaded only
# the compose file has no repository at all, and Docker handles the permissions
# on its own.
volumes:
  awah-postgres:
  awah-redis:
