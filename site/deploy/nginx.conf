# awah.99ia.com.br — vhost estático na site01.
#
# Instalado uma vez, à mão, com sudo:
#
#   sudo cp site/deploy/nginx.conf /etc/nginx/sites-available/awah
#   sudo ln -s /etc/nginx/sites-available/awah /etc/nginx/sites-enabled/awah
#   sudo nginx -t && sudo systemctl reload nginx
#
# O deploy nunca toca neste arquivo: o usuário `deploy` só escreve dentro de
# /home/deploy/awah-site, e uma configuração de servidor que muda a cada push é
# a que ninguém revisa.
#
# O tráfego chega pelo túnel do Cloudflare, não da internet direto — daí o
# listen em 127.0.0.1. No ingress do túnel:
#
#   - hostname: awah.99ia.com.br
#     service: http://127.0.0.1:8091
#
# TLS e HTTP/2 ficam com o Cloudflare; aqui dentro é HTTP puro na loopback.

server {
  listen 127.0.0.1:8091;
  server_name awah.99ia.com.br;

  # `current` é um symlink trocado atomicamente pelo deploy. O disable_symlinks
  # off é necessário justamente por isso.
  root /home/deploy/awah-site/current;
  disable_symlinks off;
  index index.html;

  charset utf-8;

  # O visitante real é o Cloudflare; sem isto todo log registra o IP do túnel.
  real_ip_header CF-Connecting-IP;
  set_real_ip_from 127.0.0.1;

  access_log /var/log/nginx/awah.access.log;
  error_log  /var/log/nginx/awah.error.log;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;
  # GIF e PNG já estão comprimidos: gzipar de novo gasta CPU e não encolhe nada.

  # Os mesmos cabeçalhos que a página assume. A CSP permite script inline por
  # causa do bloco que aplica tema e idioma antes da primeira pintura — sem
  # ele a página pisca no tema errado. connect-src é a API do GitHub, que
  # devolve a contagem de estrelas.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

  # Os arquivos de mídia e de código são reescritos por deploy, não editados no
  # lugar, mas mantêm o nome — então uma semana de cache com revalidação é o
  # meio-termo: rápido para quem volta, e no máximo uma semana de atraso para
  # quem já tinha visto. O HTML nunca fica em cache: é ele que aponta para o
  # resto.
  location /assets/ {
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }
  location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }

  # Uma página só: qualquer caminho desconhecido volta para ela em vez de dar
  # um 404 de nginx sem identidade nenhuma.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Nada aqui é secreto, mas o diretório é publicado inteiro: se um editor
  # deixar um .bak para trás, ele não vira URL.
  location ~ /\.  { return 404; }
  location ~ \.(bak|tmp|orig|swp)$ { return 404; }
}
