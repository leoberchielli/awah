<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AWAH — dez mil mensagens sem perder nenhuma, e sem perder o número">
  <rect width="1200" height="630" fill="#101216"/>

  <!-- Régua de topo: a mesma que abre o cabeçalho da página. -->
  <rect x="68" y="74" width="1064" height="1" fill="#e8e7e3"/>

  <g font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace">
    <text x="68" y="112" fill="#e8e7e3" font-size="19" font-weight="600" letter-spacing="3.4">AWAH</text>
    <text x="196" y="112" fill="#8e8d89" font-size="15" letter-spacing="0.6">gateway de whatsapp · fila durável · motor de risco · cluster</text>
    <text x="1132" y="112" fill="#8e8d89" font-size="15" text-anchor="end">MIT</text>
  </g>

  <!-- A manchete em duas vozes: o fato na sans, o argumento na serifa. -->
  <text x="68" y="290" fill="#e8e7e3" font-family="'IBM Plex Sans', 'DejaVu Sans', sans-serif" font-size="62" font-weight="600" letter-spacing="-1.4">Dez mil mensagens</text>
  <text x="68" y="356" fill="#e8e7e3" font-family="'IBM Plex Sans', 'DejaVu Sans', sans-serif" font-size="62" font-weight="600" letter-spacing="-1.4">sem perder nenhuma.</text>
  <text x="68" y="430" fill="#a3a3f7" font-family="'IBM Plex Serif', Georgia, serif" font-size="60" font-style="italic" letter-spacing="-1">E sem perder o número.</text>

  <!-- Ficha técnica: régua em cima, número sobre rótulo, colunas separadas. -->
  <rect x="68" y="508" width="1064" height="1" fill="#262a31"/>
  <g font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace">
    <text x="68" y="552" fill="#e8e7e3" font-size="30">376</text>
    <text x="68" y="578" fill="#8e8d89" font-size="13" letter-spacing="1.4">TESTES</text>

    <rect x="228" y="524" width="1" height="62" fill="#262a31"/>
    <text x="268" y="552" fill="#e8e7e3" font-size="30">45</text>
    <text x="268" y="578" fill="#8e8d89" font-size="13" letter-spacing="1.4">CHECKS VERIFICADOS</text>

    <rect x="568" y="524" width="1" height="62" fill="#262a31"/>
    <text x="608" y="552" fill="#e8e7e3" font-size="30">~450</text>
    <text x="608" y="578" fill="#8e8d89" font-size="13" letter-spacing="1.4">ENVIOS/S DE INGESTÃO</text>

    <rect x="928" y="524" width="1" height="62" fill="#262a31"/>
    <text x="1132" y="552" fill="#a3a3f7" font-size="19" text-anchor="end">awah.99ia.com.br</text>
    <text x="1132" y="578" fill="#8e8d89" font-size="13" letter-spacing="1.4" text-anchor="end">OPEN SOURCE</text>
  </g>
</svg>
