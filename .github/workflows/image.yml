name: Image

# Publishes the image to GitHub's registry and proves that it comes up.
#
# CI already built the image to prove the Dockerfile compiles, then threw the
# result away. That forced anyone wanting to try AWAH to clone the repository
# and compile — several minutes and an entire toolchain before seeing the first
# screen. Here the image starts existing for the world.
#
# "It compiled" is not "it works": the second job pulls the freshly published
# image and brings up this repository's `docker-compose.yml`, which is literally
# the installation path the documentation promises. If that path breaks, it
# breaks here rather than on the machine of someone trying the project for the
# first time.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  publicar:
    name: Build and publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      # Required for the signed provenance attestation.
      id-token: write
      attestations: write

    outputs:
      # Referenced by digest, not by tag. That is what guarantees the smoke test
      # exercises exactly the binary this job just published — a tag like `edge`
      # may have been moved by another run in the meantime.
      referencia: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      # Emulation, to build the arm64 variant on an x86 runner.
      #
      # Not a nicety: half the cheap VPS offerings today are ARM, and every Mac
      # with Apple Silicon runs Docker on arm64. Publishing amd64 only would put
      # those people under emulation, slow enough for pairing to time out.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            # `edge` is always the tip of the main branch; `latest` only ships on a tag.
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            AWAH_VERSION=${{ steps.meta.outputs.version }}
            AWAH_REVISION=${{ github.sha }}
            AWAH_BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}

      # Verifiable proof that this image came out of this commit, through this
      # workflow. Anyone running a WhatsApp gateway with their own customers'
      # credentials inside it has every reason to check where the binary came
      # from before starting it.
      #
      # GitHub only persists attestations for public or organization
      # repositories. While this one is private the step is skipped rather than
      # failing a publish that already succeeded — by the time we reach here the
      # image is already in the registry.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  fumaca:
    name: Prove the published image
    needs: publicar
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    env:
      # This is the variable `docker-compose.yml` reads. Pointing it at the
      # digest makes the repository's compose run against the freshly published
      # image instead of `latest`, without editing a single line of the file the
      # user is going to download.
      AWAH_IMAGE: ${{ needs.publicar.outputs.referencia }}
      # Set on purpose: left empty the route is open and the test would prove
      # nothing about the protection. Here both sides get exercised.
      METRICS_TOKEN: token-de-fumaca-do-ci

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull from the registry
        run: docker pull "$AWAH_IMAGE"

      - name: Check architectures and labels
        run: |
          set -euo pipefail

          # `unknown/unknown` are the attestation entries, not platforms.
          platforms=$(docker buildx imagetools inspect "$AWAH_IMAGE" --format '{{json .Manifest}}' \
            | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' \
            | grep -v unknown | sort -u)
          echo "$platforms"
          grep -qx 'linux/amd64' <<<"$platforms"
          grep -qx 'linux/arm64' <<<"$platforms"

          labels=$(docker image inspect "$AWAH_IMAGE" --format '{{json .Config.Labels}}')
          jq . <<<"$labels"
          jq -e --arg sha "$GITHUB_SHA" '
            .["org.opencontainers.image.source"] != null and
            .["org.opencontainers.image.licenses"] == "MIT" and
            .["org.opencontainers.image.revision"] == $sha
          ' <<<"$labels" > /dev/null

      # Exactly the command the README tells people to run, on the same file.
      - name: Bring up the docker-compose.yml stack
        run: docker compose up -d --wait --wait-timeout 300 api

      - name: Prove the API actually answers
        run: |
          set -euo pipefail
          api() { curl -fsS --retry 5 --retry-connrefused "http://localhost:2900$1" "${@:2}"; }
          status() { curl -s -o /dev/null -w '%{http_code}' "http://localhost:2900$1" "${@:2}"; }

          echo "--- /health: the image can say what it is"
          health=$(api /health)
          jq . <<<"$health"
          # `version` is only "dev" when the Dockerfile ARGs never arrived; the
          # revision has to match the commit, or we published something else.
          jq -e --arg sha "$GITHUB_SHA" \
            '.status == "ok" and .version != "dev" and .revision == $sha' <<<"$health" > /dev/null

          echo "--- /health/ready: Postgres and Redis really connected"
          ready=$(api /health/ready)
          jq . <<<"$ready"
          jq -e '.status == "ready" and .checks.database and .checks.redis' <<<"$ready" > /dev/null

          echo "--- a fresh instance asks to be set up"
          jq -e '.needsSetup == true' <<<"$(api /v1/auth/bootstrap)" > /dev/null

          echo "--- create the first organization"
          created=$(api /v1/auth/register -X POST -H 'content-type: application/json' -d '{
            "organizationName": "Smoke",
            "name": "Checker",
            "email": "smoke@example.invalid",
            "password": "ci-only-password-1234"
          }')
          jq -e '.organization.id != null and .user.id != null' <<<"$created" > /dev/null

          # The read that follows is what closes the loop: it proves the write
          # crossed the application into Postgres and came back. That is as near
          # to "it works" as you get without a real WhatsApp number.
          echo "--- and registration closes itself after that"
          jq -e '.needsSetup == false' <<<"$(api /v1/auth/bootstrap)" > /dev/null

          echo "--- a browser gets the panel on the same port"
          # The `accept` is not decoration: it is what separates browsing from
          # integrating. Without the header the answer is the JSON 404, and that
          # is correct.
          panel=$(api / -H 'accept: text/html')
          grep -q 'id="root"' <<<"$panel"

          echo "--- a client-side route also lands on the panel"
          [ "$(status /sessions -H 'accept: text/html')" = 200 ]

          echo "--- but a missing API path stays JSON, even when html is asked for"
          # The regression this case prevents: the SPA answering 200 with HTML to
          # a mistyped `/v1/...`, and whoever is integrating spending the
          # afternoon working out why their JSON became `<!doctype html>`.
          [ "$(status /v1/does-not-exist -H 'accept: text/html')" = 404 ]

          echo "--- assets served with an immutable cache"
          asset=$(grep -o '/assets/[A-Za-z0-9._-]*\.js' <<<"$panel" | awk 'NR==1')
          curl -fsSI "http://localhost:2900$asset" | tr -d '\r' | grep -qi 'cache-control:.*immutable'

          echo "--- /metrics demands the token once one is set"
          [ "$(status /metrics)" = 401 ]
          metrics=$(api /metrics -H "authorization: Bearer $METRICS_TOKEN")
          grep -q 'awah_' <<<"$metrics"

      - name: Logs, when something failed
        if: failure()
        run: docker compose logs --no-color --tail=200

      # `-v` is safe here because the runner is disposable. Never in production:
      # those volumes hold the auth state of every session.
      - name: Tear down
        if: always()
        run: docker compose down -v
