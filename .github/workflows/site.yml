name: Site

# A página não é publicada daqui. Ela é servida do host que roda os túneis, e
# quem publica é `site/deploy/publish.sh` — a chave da site01 vive nos secrets
# deste repositório e não existe na máquina onde a página está.
#
# O que sobra para a CI é a verificação que nada mais faria: o inglês é
# aplicado por cima do HTML em português, e uma chave que existe de um lado e
# não do outro é um parágrafo que silenciosamente para de traduzir.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Chaves de tradução e integridade da página
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Chaves de tradução batem
        run: |
          node -e "
          const f = require('fs');
          const h = f.readFileSync('site/index.html', 'utf8');
          const j = f.readFileSync('site/assets/i18n.js', 'utf8');
          const keys = new Set([...h.matchAll(/data-i18n=\"([^\"]+)\"/g)].map(m => m[1]));
          [...h.matchAll(/data-i18n-attr=\"([^\"]+)\"/g)].forEach(m =>
            m[1].split(',').forEach(p => keys.add(p.split(':')[1].trim())));
          const en = new Set([...j.matchAll(/^\s*'?([a-z0-9._]+)'?\s*:/gmi)].map(m => m[1]));
          const missing = [...keys].filter(k => !en.has(k));
          if (missing.length) {
            console.error('::error::Chaves usadas no index.html sem texto em inglês: ' + missing.join(', '));
            process.exit(1);
          }
          console.log(keys.size + ' chaves, todas traduzidas');
          "

      # Um href para um arquivo que não existe é o tipo de erro que só aparece
      # quando alguém clica — e ninguém avisa.
      - name: Recursos referenciados existem
        run: |
          node -e "
          const f = require('fs');
          const h = f.readFileSync('site/index.html', 'utf8');
          const refs = [...h.matchAll(/(?:src|href)=\"(assets\/[^\"]+)\"/g)].map(m => m[1]);
          const missing = [...new Set(refs)].filter(r => !f.existsSync('site/' + r));
          if (missing.length) {
            console.error('::error::A página aponta para arquivos que não existem: ' + missing.join(', '));
            process.exit(1);
          }
          console.log(new Set(refs).size + ' recursos, todos presentes');
          "

      # O servidor do host roda sem dependência nenhuma; se ele deixar de
      # carregar, a página para de subir na próxima publicação.
      - name: O servidor estático carrega
        run: node --check site/deploy/serve.mjs && echo 'serve.mjs ok'
