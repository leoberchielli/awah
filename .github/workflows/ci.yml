name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types and tests
    runs-on: ubuntu-latest

    # The integration tests exercise the real app against Postgres and Redis.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: awah
          POSTGRES_PASSWORD: awah
          POSTGRES_DB: awah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U awah -d awah"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://awah:awah@localhost:5432/awah
      REDIS_URL: redis://localhost:6379
      ENCRYPTION_KEY: YXdhaC1jaS1rZXktbm90LWZvci1wcm9kdWN0aW9uISE=
      COOKIE_SECRET: awah-ci-cookie-secret-do-not-use-in-production

    steps:
      - uses: actions/checkout@v4

      # No `version` here: the action reads `packageManager` from package.json,
      # and declaring it in both places makes it abort with "multiple versions".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and formatting
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      # A missing key does not fail the build — it falls back to English, and
      # that is exactly what makes partial translation possible. What does fail
      # is an unknown key or a lost placeholder: a vanished `{n}` makes the
      # number disappear silently, and no type checker catches it because the
      # value is still a string.
      - name: Translation catalogs
        run: pnpm i18n:check

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  migrations:
    name: Migrations apply to a clean database
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: awah
          POSTGRES_PASSWORD: awah
          POSTGRES_DB: awah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U awah -d awah"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      # No `version` here: the action reads `packageManager` from package.json,
      # and declaring it in both places makes it abort with "multiple versions".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://awah:awah@localhost:5432/awah

      # If the schema changed without a matching migration, drizzle-kit
      # generates a new file here and the diff stops being clean — the build
      # fails, and the author has to commit the migration alongside the change.
      - name: Schema and migrations are in sync
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "::error::The schema changed without a committed migration. Run 'pnpm db:generate' and commit the result."
            git status --porcelain packages/db/migrations
            exit 1
          fi
        env:
          DATABASE_URL: postgres://awah:awah@localhost:5432/awah

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
