name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest

    # Os testes de integração exercitam o app real contra Postgres e Redis.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: awah
          POSTGRES_PASSWORD: awah
          POSTGRES_DB: awah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U awah -d awah"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://awah:awah@localhost:5432/awah
      REDIS_URL: redis://localhost:6379
      ENCRYPTION_KEY: YXdhaC1jaS1rZXktbm90LWZvci1wcm9kdWN0aW9uISE=
      COOKIE_SECRET: awah-ci-cookie-secret-nao-usar-em-producao

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint e formatação
        run: pnpm lint

      - name: Checagem de tipos
        run: pnpm typecheck

      - name: Aplicar migrations
        run: pnpm db:migrate

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build

  migrations:
    name: Migrations aplicam em banco limpo
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: awah
          POSTGRES_PASSWORD: awah
          POSTGRES_DB: awah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U awah -d awah"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Aplicar migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://awah:awah@localhost:5432/awah

      # Se o schema mudou sem migration correspondente, o drizzle-kit gera um
      # arquivo novo aqui e o diff deixa de estar limpo — o build falha e o
      # autor é obrigado a versionar a migration junto da mudança.
      - name: Schema e migrations estão em sincronia
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "::error::O schema mudou sem migration versionada. Rode 'pnpm db:generate' e faça commit."
            git status --porcelain packages/db/migrations
            exit 1
          fi
        env:
          DATABASE_URL: postgres://awah:awah@localhost:5432/awah

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
